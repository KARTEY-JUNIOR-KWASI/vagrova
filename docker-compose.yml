services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: vagrova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vagrova
      POSTGRES_PASSWORD: vagrova_dev_password
      POSTGRES_DB: vagrova
    ports:
      - "5433:5432"
    volumes:
      - vagrova_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vagrova -d vagrova"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vagrova-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - vagrova_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: vagrova-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vagrova_minio
      MINIO_ROOT_PASSWORD: vagrova_minio_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - vagrova_miniodata:/data

volumes:
  vagrova_pgdata:
  vagrova_redisdata:
  vagrova_miniodata:
